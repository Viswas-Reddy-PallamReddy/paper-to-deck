<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper → Deck</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="topbar">
  <div class="logo">P</div>
  <h1>Paper → Deck</h1>
  <div class="spacer"></div>
  <button class="ghost hidden" id="new-btn">New paper</button>
</div>

<main>
  <!-- 1. upload -->
  <section id="upload-view">
    <div class="card">
      <div class="drop" id="drop">
        <strong>Drop a research paper here</strong>
        <span>or click to choose a PDF</span>
      </div>
      <input type="file" id="file" accept="application/pdf" class="hidden">
      <div class="file-name" id="file-name"></div>

      <div class="row">
        <div>
          <label for="lang">Narration language</label>
          <select id="lang"></select>
        </div>
        <div class="spacer"></div>
        <button class="primary" id="go" disabled>Generate deck</button>
      </div>

      <div class="progress hidden" id="progress">
        <div class="bar"><i id="bar"></i></div>
        <p id="stage">Starting…</p>
      </div>
      <div class="error hidden" id="error"></div>
    </div>
  </section>

  <!-- 2. deck + Q&A -->
  <section id="deck-view" class="hidden">
    <div class="card slide-card">
      <div class="slide-head">
        <h2 id="slide-title"></h2>
        <span class="count" id="slide-count"></span>
      </div>
      <ul id="slide-bullets"></ul>
      <div id="slide-visual"></div>
      <div class="audio-row"><audio id="slide-audio" controls></audio></div>
    </div>

    <div class="nav">
      <button id="prev">← Prev</button>
      <div class="dots" id="dots"></div>
      <button id="next">Next →</button>
    </div>

    <div class="card qa">
      <div class="qa-actions">
        <button class="rec" id="ask">Ask about this slide</button>
        <span class="qa-status" id="qa-status"></span>
      </div>
      <div class="qa-out" id="qa-out"></div>
    </div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
